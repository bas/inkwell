name: Feature request
description: Suggest an improvement or new capability for Inkwell.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Keep proposals scoped and aligned with Inkwell's constraints:
        macOS arm64 only, Primer-only UI, Markdown files as the source of truth.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what need prompts it? Lead with the "why".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Describe the behavior, not necessarily the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, references, or related issues.
    validations:
      required: false
